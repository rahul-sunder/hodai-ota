
name: Auto Increment Version

on:
  push:
    paths:
      - 'schedule.json' # Only runs when this specific file is changed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Increment Version
        run: |
          # Read the current version, default to 0 if file doesn't exist
          VERSION=$(cat version.txt || echo 0)
          # Increment by 1
          NEW_VERSION=$((VERSION + 1))
          # Overwrite version.txt
          echo $NEW_VERSION > version.txt
          echo "New Version: $NEW_VERSION"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "Auto-increment version to $(cat version.txt)"
          git push
